<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbfbfc">
<title>情景剧 · 语言学习包</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.eplist{padding-top:22px}
.eplist h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
.eplist p.sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.6}
.ephead{padding:22px 0 10px}
.ephead .kicker{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600;text-transform:uppercase}
.ephead h1{margin:8px 0 6px;font-size:23px;letter-spacing:-.02em}
.ephead p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.dlg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin:14px 0}
.navrow{display:flex;gap:10px;margin:16px 0 8px}
.navrow a{flex:1;text-align:center;text-decoration:none;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--line);color:var(--ink2);background:#fff}
.navrow a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.whoA{background:#eef1fe;color:#2b46a8}
.whoB{background:#eef7f1;color:#0d7a56}
.whoC{background:#fdf3ea;color:#8a5a00}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabbar">
  <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首页</a>
  <a href="list.html?lang=id"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>词表</a>
  <a href="study.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 7h8M8 11h6"/></svg>背诵</a>
  <a href="scenes.html" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9 9 0 0 1-3.8-.8L3 21l1.8-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>情景</a>
</nav>

<audio id="player"></audio>
<script>
const $app = document.getElementById('app');
const player = document.getElementById('player');
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

let EPISODES = [];
let doneSet = new Set();
try{ doneSet = new Set(JSON.parse(localStorage.getItem('ls_done_dlg') || '[]')); }catch(e){}

function playEp(ep, li, btn){
  player.pause();
  player.src = 'audio/dlg/' + String(ep).padStart(2,'0') + '-' + String(li).padStart(2,'0') + '.mp3';
  document.querySelectorAll('.line2 button.on').forEach(b=>b.classList.remove('on'));
  player.play().then(()=> btn.classList.add('on')).catch(()=> btn.classList.remove('on'));
  player.onended = ()=> btn.classList.remove('on');
}

function renderList(){
  const cards = EPISODES.map(e=>{
    const done = doneSet.has(e.ep);
    return '<a class="ep' + (done?' done':'') + '" href="#ep' + e.ep + '">'
      + '<div class="no">' + (done ? '✓' : e.ep) + '</div>'
      + '<div class="body"><div class="t">' + esc(e.title) + '</div>'
      + '<div class="d">' + esc(e.intro) + '</div>'
      + '<div class="n">' + (e.lines ? e.lines.length : 0) + ' 句对话</div></div></a>';
  }).join('');

  $app.innerHTML = '<section class="eplist">'
    + '<div class="eyebrow" style="font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600;text-transform:uppercase;margin-bottom:12px">Drama · 16 Episodes</div>'
    + '<h1>小王在印尼的第一个月</h1>'
    + '<p class="sub">跟着一个刚毕业的物流管培生，从下飞机到独立带班。每集 10~14 句，都是真会用上的话，点每句右边的小三角单独听。</p>'
    + cards + '</section>';
}

function renderEp(no){
  const e = EPISODES.find(x=>x.ep === +no);
  if (!e) return renderList();
  const lines = (e.lines||[]).map((ln, i)=>{
    const who = ln.who || 'A';
    return '<div class="line2"><div class="who who' + who + '">' + who + '</div>'
      + '<div class="txt"><div class="id">' + esc(ln.id) + '</div><div class="cn">' + esc(ln.cn) + '</div></div>'
      + '<button data-ep="' + e.ep + '" data-li="' + (i+1) + '" aria-label="播放">' + ICON + '</button></div>';
  }).join('');

  const keys = (e.keys||[]).map(k=>'<span>' + esc(k) + '</span>').join('');
  const prev = e.ep > 1 ? '<a href="#ep' + (e.ep-1) + '">← 上一集</a>' : '<a href="#">全部剧集</a>';
  const next = EPISODES.some(x=>x.ep === e.ep + 1)
    ? '<a class="primary" href="#ep' + (e.ep+1) + '">下一集 →</a>'
    : '<a class="primary" href="#">回到列表</a>';

  $app.innerHTML = '<section class="ephead">'
    + '<div class="kicker">Episode ' + e.ep + ' / ' + EPISODES.length + '</div>'
    + '<h1>' + esc(e.title) + '</h1><p>' + esc(e.intro || '') + '</p>'
    + '<div class="legend"><span><i class="whoW">W</i>小王</span><span><i class="whoS">S</i>Sari</span>'
    + '<span><i class="whoB">B</i>班长</span><span><i class="whoA">A</i>Andi</span><span><i class="whoG">G</i>其他人</span></div>'
    + '</section>'
    + '<div class="dlg">' + lines + '</div>'
    + (keys ? '<div class="keys">' + keys + '</div>' : '')
    + '<div class="navrow">' + prev + next + '</div>'
    + '<div style="text-align:center;margin-top:14px"><button class="reveal" id="markDone" style="max-width:280px;margin:0 auto;border-style:solid">'
    + (doneSet.has(e.ep) ? '✓ 本集已练过' : '标记这一集练过了') + '</button></div>';

  document.querySelectorAll('.line2 button').forEach(b=>{
    b.addEventListener('click', ()=> playEp(b.dataset.ep, b.dataset.li, b));
  });
  const mk = document.getElementById('markDone');
  mk.addEventListener('click', ()=>{
    if (doneSet.has(e.ep)) doneSet.delete(e.ep); else doneSet.add(e.ep);
    try{ localStorage.setItem('ls_done_dlg', JSON.stringify([...doneSet])); }catch(err){}
    mk.textContent = doneSet.has(e.ep) ? '✓ 本集已练过' : '标记这一集练过了';
  });
  window.scrollTo({top:0});
}

function route(){
  const m = location.hash.match(/^#ep(\d+)$/);
  if (m) renderEp(m[1]); else renderList();
}
window.addEventListener('hashchange', route);

fetch('data/scenes.json').then(r=>r.json()).then(d=>{
  EPISODES = d.sort((a,b)=>a.ep-b.ep);
  route();
}).catch(()=>{
  $app.innerHTML = '<div class="empty">' + (location.protocol === 'file:' ? '本地双击打不开，请用 http:// 访问' : '剧本加载失败，请刷新') + '</div>';
});
</script>
</body>
</html>
