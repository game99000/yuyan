<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="印尼语学习">
<meta name="theme-color" content="#fbfbfc">
<meta name="description" content="印尼语 2489 词 + 雅思 3998 词，每个词配例句与真人发音，情景剧练习日常对话">
<title>印尼语 · 英语 · 学习包</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232b46a8'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
<style>
.today{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:18px 0 12px;display:flex;align-items:center;gap:16px}
.today .dial{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto;background:conic-gradient(var(--accent) 0deg,var(--line2) 0deg)}
.today .dial i{position:absolute;inset:7px;background:#fff;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12.5px;font-weight:700;color:var(--accent);line-height:1.1;text-align:center}
.today .info b{display:block;font-size:17px;letter-spacing:-.01em}
.today .info span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.today .streak{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
.today .streak b{display:block;font-size:19px;color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:#fff;border-radius:16px;padding:17px 18px;text-decoration:none;box-shadow:0 14px 30px -18px rgba(43,70,168,.8)}
.cta b{font-size:16.5px;font-weight:650}
.cta span{display:block;font-size:12.5px;opacity:.85;margin-top:3px}
.cta .arw{font-size:20px;opacity:.9}
.grid2{margin-top:12px}
.total{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:12px}
.total .hd{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.total .hd b{font-variant-numeric:tabular-nums}
.total .bar{height:5px;border-radius:99px;background:var(--line2);margin-top:9px;overflow:hidden}
.total .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.total .sub{font-size:11.5px;color:var(--faint);margin-top:7px}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero" style="padding:34px 0 0">
    <div class="eyebrow">Bahasa Indonesia · IELTS</div>
    <h1>今天也来<br><em>练几句</em></h1>
  </header>

  <div class="today">
    <div class="dial" id="dial"><i id="dialTxt">0<br>个</i></div>
    <div class="info"><b id="todayTitle">今日还没开始</b><span id="todaySub">目标 20 个 · 一组大约 6 分钟</span></div>
    <div class="streak"><b id="streak">0</b>连续天数</div>
  </div>

  <a class="cta" href="study.html">
    <div><b>开始背一组</b><span>卡片式记忆 · 会了打勾，没把握重考</span></div>
    <div class="arw">→</div>
  </a>

  <div class="section-title"><h2>四个模块</h2><span class="line"></span></div>
  <div class="grid2">
    <a class="tool" href="list.html?lang=id">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg></span>
      <b>印尼语词表</b><span id="idCount">2,489 词 · 带例句</span>
    </a>
    <a class="tool" href="list.html?lang=en">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg></span>
      <b>雅思词表</b><span id="enCount">3,998 词 · 带音标</span>
    </a>
    <a class="tool" href="scenes.html" style="grid-column:1 / -1">
      <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9 9 0 0 1-3.8-.8L3 21l1.8-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg></span>
      <b>情景剧 · 小王在印尼的第一个月</b><span>16 集连续剧情，覆盖日常与工地对话，逐句发音</span>
    </a>
  </div>

  <div class="total">
    <div class="hd"><span>我的总进度</span><b id="totTxt">0 / 6,487</b></div>
    <div class="bar"><i id="totBar"></i></div>
    <div class="sub" id="totSub">进度只存在这台设备上，换手机不同步</div>
  </div>

  <div class="section-title"><h2>更多</h2><span class="line"></span></div>
  <div class="grid2">
    <a class="tool" href="classic.html"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><b>精讲版</b><span>429 词带语法</span></a>
    <a class="tool" href="语言学习-打印版.pdf"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span><b>打印版 PDF</b><span>36 页</span></a>
  </div>

  <footer>语言学习包 · 物流管培生定制</footer>
</div>

<nav class="tabbar">
  <a href="index.html" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>首页</a>
  <a href="list.html?lang=id"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>词表</a>
  <a href="study.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 7h8M8 11h6"/></svg>背诵</a>
  <a href="scenes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9 9 0 0 1-3.8-.8L3 21l1.8-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>情景</a>
</nav>

<script>
const fmt = n => (n||0).toLocaleString('en-US');
const GOAL = 20;
const t = new Date().toISOString().slice(0,10);

let daily = {}, st = {n:0};
try{ daily = JSON.parse(localStorage.getItem('ls_daily') || '{}'); }catch(e){}
try{ st = JSON.parse(localStorage.getItem('ls_streak') || '{"n":0}'); }catch(e){}
const n = daily[t] || 0;
const pct = Math.min(100, Math.round(n / GOAL * 100));

document.getElementById('dial').style.background = 'conic-gradient(var(--accent) ' + (pct*3.6) + 'deg, var(--line2) 0deg)';
document.getElementById('dialTxt').innerHTML = n + '<br>个';
document.getElementById('todayTitle').textContent = n ? ('今天已经背了 ' + n + ' 个') : '今日还没开始';
document.getElementById('todaySub').textContent = n
  ? ('目标 ' + GOAL + ' 个 · ' + (n >= GOAL ? '已达标，可以再来一组' : '还差 ' + (GOAL - n) + ' 个'))
  : ('目标 ' + GOAL + ' 个 · 一组大约 6 分钟');
document.getElementById('streak').textContent = st.n || 0;

function readDone(k){ try{ return JSON.parse(localStorage.getItem(k) || '[]').length; }catch(e){ return 0; } }
const a = readDone('ls_done_id'), b = readDone('ls_done_en');

fetch('data/id.json').then(r=>r.json()).then(d=>{
  const tot = d.length + 3998;
  document.getElementById('idCount').textContent = fmt(d.length) + ' 词 · 带例句';
  document.getElementById('totTxt').textContent = fmt(a + b) + ' / ' + fmt(tot);
  document.getElementById('totBar').style.width = ((a+b)/tot*100).toFixed(2) + '%';
  if (a+b) document.getElementById('totSub').textContent = '印尼语 ' + fmt(a) + ' · 英语 ' + fmt(b) + '，继续加油';
}).catch(()=>{});

fetch('data/en.json').then(r=>r.json()).then(d=>{
  document.getElementById('enCount').textContent = fmt(d.length) + ' 词 · 带音标';
}).catch(()=>{});
</script>
</body>
</html>
